services:
  web:
    build: .
    ports:
      - "3000:3000"
    healthcheck:
      # La imagen slim no trae curl/wget; se usa el fetch de Node.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
